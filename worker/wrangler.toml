name = "voice-diary-api"
main = "src/index.js"
compatibility_date = "2026-10-24"
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "voice-diary-db"
database_id = "913e350b-6cc2-467e-84f0-696a7c042211"
remote = true

